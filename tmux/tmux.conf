# set bash as your default Tmux shell
set-option -g default-shell /bin/zsh

# improve colors
set -sa terminal-overrides ",xterm*:Tc"

# Forward extended key sequences (Shift+Enter, etc.) to applications
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm-ghostty:extkeys'

# Change prefix key to C-a, easier to type, same to "screen"
set -g prefix C-a
unbind-key C-b
# NB: no `bind-key C-a send-prefix` — prefix+C-a is pane cycling (see below),
# so there is deliberately no way to send a literal C-a to a nested app.

# Put status bar on top
set-option -g status-position bottom

# Set parent terminal title to reflect current window in tmux session
set -g set-titles on
set -g set-titles-string "#I:#W"

# start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1
set-window-option -g pane-base-index 1

# renumber windows sequentially after closing any of them
set -g renumber-windows on

# Enable passthrough som messages reach outer terminal
set -g allow-passthrough on

# mouse mode on
set -g mouse on

# Disable pane focus change on mouse click
unbind-key -T root MouseDown1Pane

# Allow drag to copy without redundant triggers
unbind-key -T root MouseDrag1Pane
bind-key -T root MouseDrag1Pane copy-mode \; send-keys -X begin-selection

# Copy the drag selection to the system clipboard when the button is released.
# Without this the selection simply ends and nothing is ever copied.
# Shift+drag bypasses tmux entirely for Ghostty's own native selection
# (Ghostty's mouse-shift-capture defaults to false) — no config needed for that.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Disable focus shift for scrolling
unbind-key -T root WheelUpPane
unbind-key -T root WheelDownPane

# don't rename my windows
set-option -g automatic-rename off

# increase scrollback lines
set -g history-limit 10000

# rebind copy mode
bind a copy-mode

# act like vim
set-window-option -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind 'M-C-RIGHT' select-pane -R
bind 'M-C-LEFT' select-pane -L
bind 'M-C-UP' select-pane -U
bind 'M-C-DOWN' select-pane -D
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# Window pane commands
bind c new-window -c "#{pane_current_path}"
bind UP split-window -b -c "#{pane_current_path}"
bind DOWN split-window -c "#{pane_current_path}"
bind LEFT split-window -b -h -c "#{pane_current_path}"
bind RIGHT split-window -h -c "#{pane_current_path}"
bind C new-window
bind '_' split-window -v
bind '|' split-window -h

# Worktrees. `wt` does the git work and knows nothing about tmux; `tmux-wt`
# turns the path it prints into a window. New windows inherit the session
# environment, so the context comes along without being passed explicitly.
bind -N "Open a git worktree (fzf; type a new name to create it)" \
  G display-popup -E -d "#{pane_current_path}" -w 80 -h 14 "tmux-wt open"
bind -N "Remove a git worktree (keeps the branch)" \
  D display-popup -E -d "#{pane_current_path}" -w 80 -h 14 "tmux-wt rm"

# Keybinding cheatsheet, generated from the bindings themselves so it cannot
# drift from the config.
bind -N "Show this cheatsheet" \
  '?' display-popup -E -w 90 -h 24 "tmux list-keys -N | fzf --reverse --prompt='key> '"

# quick pane cycling
unbind ^A
bind ^A select-pane -t :.+

# don't suspend-client
unbind-key C-z

# Safely source local tmux configuration only if it exists
if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"

# Reload tmux configuration
bind r source-file ~/.tmux.conf \; display "Config reloaded"

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# SHELL_CONTEXT is deliberately NOT in update-environment. That list is copied
# from the CLIENT into the session environment on every attach, and variables
# missing from the client are REMOVED from the session — so attaching from a
# plain shell (which exports SHELL_CONTEXT="") wipes the session's context and
# every new window after that starts context-less. `cch` writes the session
# environment directly, and the `t` shell function passes -e, covering both cases
# without the attach hazard.

# Plugin config - keep at bottom of .tmux.conf
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' # https://github.com/tmux-plugins/tmux-sensible
set -g @plugin 'fabioluciano/tmux-tokyo-night' # https://github.com/fabioluciano/tmux-tokyo-night
set -g @plugin 'tmux-plugins/tmux-open' # https://github.com/tmux-plugins/tmux-open
set -g @plugin 'tmux-plugins/tmux-copycat' # https://github.com/tmux-plugins/tmux-copycat
set -g @plugin 'tmux-plugins/tmux-yank' # https://github.com/tmux-plugins/tmux-yank
set -g @theme_variation 'night'
set -g @theme_plugins ''

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# ---------------------------------------------------------------------------
# Agent status badges
#
# Set AFTER tpm on purpose: tmux-tokyo-night writes its own window-status-format
# when it loads, so anything here has to come last to survive.
#
# State is written by `tmux-agent-status` from each agent's own lifecycle hooks
# (see docs/agents.md), so it is authoritative rather than scraped from output.
# Costs zero extra rows: the badge rides the status line and pane border that
# are already on screen.
#
#   working  yellow dot     blocked  red triangle (wants you)
#   done     green check    idle     nothing
# ---------------------------------------------------------------------------

set -g @agent_pane_badge "#{?#{==:#{@agent_status},working},#[fg=yellow]● ,#{?#{==:#{@agent_status},done},#[fg=green]✓ ,#{?#{==:#{@agent_status},blocked},#[fg=red]▲ ,}}}#[default]"

# Window badge reads @agent_win (the roll-up). Using @agent_status here would
# resolve the ACTIVE PANE's value instead, via tmux's pane->window inheritance.
set -g @agent_win_badge "#{?#{==:#{@agent_win},working},#[fg=yellow]● ,#{?#{==:#{@agent_win},done},#[fg=green]✓ ,#{?#{==:#{@agent_win},blocked},#[fg=red]▲ ,}}}#[default]"

set -g window-status-format         " #I #W #{E:@agent_win_badge}"
set -g window-status-current-format " #I #W #{E:@agent_win_badge}"

# Per-pane state on the pane border — also zero extra rows.
set -g pane-border-status top
set -g pane-border-format " #P #{pane_current_command} #{E:@agent_pane_badge}"

# `done` means finished AND not yet looked at, so looking at it clears it.
set-hook -g pane-focus-in "if -F '#{==:#{@agent_status},done}' 'run-shell \"tmux-agent-status clear #{pane_id}\"'"

# A pane dying takes its state with it, but the window badge is a roll-up and
# would otherwise keep showing the dead pane's state forever.
set-hook -g pane-exited "run-shell \"tmux-agent-status rollup #{window_id}\""
